\* Model-checking config for ShardHead.tla's SpecDecoupled -- a PROPOSED,
\* not-yet-implemented-in-Java redesign that decouples a writer's generation
\* numbering from local Lucene state entirely (always computing the next
\* target live as head.generation + 1 and fencing against the live
\* head.holder, mirroring how CompactorPublish already works).
\*
\* This run exists to de-risk the redesign *before* touching the hot-path
\* Java code (ObjectStoreCommitHeadPublisher / ObjectStoreWriterEngine) --
\* see PublishDecoupled's own comment in ShardHead.tla for a design flaw
\* already caught and fixed by hand before this run (checking live
\* head.holder = n instead of stale localHead[n].holder = n).
\*
\* Reproduce:
\*   java -jar tla2tools.jar -config ShardHeadDecoupled.cfg ShardHead.tla

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxTerm = 3
    MaxGeneration = 3
    NoNode = NoNode
    Compactor = Compactor

SPECIFICATION SpecDecoupled

INVARIANTS
    TypeOK
    AtMostOneValidHolder
    AuthorshipHonest

PROPERTIES
    TermNeverDecreases
    GenerationMonotonicWithinTerm
    GenerationResetsOnNewTerm
    OnlyTheCurrentHolderCanPublishDecoupled
