\* Model-checking config for ShardHead.tla's Spec (the real, current, FIXED
\* production code). Run and passing (see rfc-serverless-opensearch.md's
\* formal-model section for the full result) -- reproduce with:
\*   java -jar tla2tools.jar -config ShardHead.cfg ShardHead.tla
\*
\* See ShardHeadBuggy.cfg for the companion run demonstrating that the
\* pre-fix code (SpecBuggy) violates AuthorshipHonest.
\*
\* Nodes/MaxTerm/MaxGeneration are kept small deliberately: this is a model
\* of the state-machine *shape*, and the properties below either hold for
\* all sizes or fail on the smallest interesting counterexample -- there is
\* no correctness reason to check larger bounds, only more TLC runtime.

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxTerm = 3
    MaxGeneration = 3
    NoNode = NoNode
    Compactor = Compactor

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AtMostOneValidHolder
    AuthorshipHonest

PROPERTIES
    TermNeverDecreases
    GenerationMonotonicWithinTerm
    GenerationResetsOnNewTerm
    OnlyTheCurrentHolderCanPublish
