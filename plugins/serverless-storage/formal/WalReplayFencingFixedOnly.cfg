\* Isolates FixedReplayNeverIncludesAPostFencingWrite so it's checked exhaustively
\* over the full reachable state space, not short-circuited by the (expected) naive
\* violation. See WalReplayFencing.cfg for the paired run demonstrating the bug.
\*
\* Reproduce:
\*   java -jar tla2tools.jar -config WalReplayFencingFixedOnly.cfg WalReplayFencing.tla

CONSTANTS
    Nodes = {n1, n2}
    MaxTerm = 4
    MaxWalLen = 5

SPECIFICATION Spec

INVARIANTS
    TypeOK
    FixedReplayNeverIncludesAPostFencingWrite
