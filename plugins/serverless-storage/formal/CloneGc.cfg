\* Model-checking config for CloneGc.tla. Both properties are checked together
\* deliberately: NoCloneEverReferencesADeletedGenerationBuggy is EXPECTED to
\* fail (that's the shipped-then-fixed bug being demonstrated),
\* NoCloneEverReferencesADeletedGenerationFixed is expected to hold (that's
\* the fix). Run and read both results together.
\*
\* Reproduce:
\*   java -jar tla2tools.jar -config CloneGc.cfg CloneGc.tla

CONSTANTS
    MaxGeneration = 3

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoCloneEverReferencesADeletedGenerationBuggy
    NoCloneEverReferencesADeletedGenerationFixed
