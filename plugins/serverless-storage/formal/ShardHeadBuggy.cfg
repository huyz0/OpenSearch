\* Model-checking config for ShardHead.tla's SpecBuggy -- the PRE-FIX
\* production code (adds PublishBuggy, modeling the
\* "manifest.generation() <= currentHead.latestManifestGeneration() =>
\* return true" shortcut this session found and removed from
\* ObjectStoreCommitHeadPublisher#publishCommitAsHead).
\*
\* Expected result: AuthorshipHonest FAILS here, with TLC printing a
\* concrete counterexample trace -- deliberately run to demonstrate the bug
\* was a real protocol violation, not just an implementation nitpick. Every
\* other property still holds (the bug never mutates `head` incorrectly, it
\* only misreports to its caller what happened -- see ShardHead.tla's
\* GenerationMonotonicWithinTerm comment).
\*
\* Reproduce:
\*   java -jar tla2tools.jar -config ShardHeadBuggy.cfg ShardHead.tla

CONSTANTS
    Nodes = {n1, n2, n3}
    MaxTerm = 3
    MaxGeneration = 3
    NoNode = NoNode
    Compactor = Compactor

SPECIFICATION SpecBuggy

INVARIANTS
    TypeOK
    AtMostOneValidHolder
    AuthorshipHonest

PROPERTIES
    TermNeverDecreases
    GenerationMonotonicWithinTerm
    GenerationResetsOnNewTerm
    OnlyTheCurrentHolderCanPublish
