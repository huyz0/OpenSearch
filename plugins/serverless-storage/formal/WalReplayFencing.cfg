\* Model-checking config for WalReplayFencing.tla. Both properties are checked
\* together deliberately: NaiveReplayNeverIncludesAPostFencingWrite is EXPECTED
\* to fail (that's the bug being demonstrated), FixedReplayNeverIncludesAPostFencingWrite
\* is expected to hold (that's the fix). Run and read both results together.
\*
\* Reproduce:
\*   java -jar tla2tools.jar -config WalReplayFencing.cfg WalReplayFencing.tla

CONSTANTS
    Nodes = {n1, n2}
    MaxTerm = 4
    MaxWalLen = 5

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NaiveReplayNeverIncludesAPostFencingWrite
    FixedReplayNeverIncludesAPostFencingWrite
