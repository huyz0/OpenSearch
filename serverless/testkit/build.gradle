apply plugin: 'opensearch.build'

dependencies {
  implementation project(':server')
  implementation project(':serverless:shell')
  implementation project(':serverless:auth')
  runtimeOnly project(':libs:opensearch-plugin-classloader')
  implementation project(':modules:transport-netty4')
  testImplementation project(':test:framework')
  // Conformance against a real S3 API: the suite needs the container production would use.
  testImplementation project(':plugins:repository-s3')
  // The same suite against GCS and Azure emulators, through each plugin's production blob store.
  testImplementation project(':plugins:repository-gcs')
  testImplementation project(':plugins:repository-azure')
  // The GCS plugin declares its client libraries as implementation, so they reach this module at runtime only.
  // The emulator helper names a few of their types; compile against the versions the plugin pins.
  ['com.google.cloud:google-cloud-storage:2.60.0', 'com.google.cloud:google-cloud-core:2.60.0',
   'com.google.cloud:google-cloud-core-http:2.60.0', 'com.google.api:gax:2.72.1', 'com.google.api:api-common:2.55.1',
   'com.google.auth:google-auth-library-credentials:1.41.0', 'com.google.auth:google-auth-library-oauth2-http:1.41.0',
   'org.checkerframework:checker-qual:4.2.3'].each {
    testCompileOnly(it) { transitive = false }
  }
}

// The GCS plugin pins a newer guava than the one the Azure plugin takes from the version catalog, and the build
// fails on any version conflict. Both only need it at runtime; the newer one serves both.
configurations.named('testRuntimeClasspath').configure {
  resolutionStrategy.force 'com.google.guava:guava:33.4.0-jre'
}

// Spikes (package org.opensearch.serverless.spike) live here. They are disposable probes, not a
// regression suite.
tasks.named('forbiddenApisMain').configure {
  replaceSignatureFiles 'jdk-signatures'
}

// Multi-process tests fork real JVMs. The test framework installs a seccomp system-call filter that
// blocks execve -- deliberately, since a node has no business spawning children -- so these cannot run
// under the ordinary `test` task. They get their own task with the filter off rather than the whole
// module losing it, so everything that does not need to fork keeps the guard.
tasks.named('test').configure {
  exclude '**/ServerlessContentionTests.class'
  exclude '**/ServerlessFleetTests.class'
  exclude '**/MinioBlobContainerConformanceTests.class'
  exclude '**/SeaweedBlobContainerConformanceTests.class'
  exclude '**/Rustfs*BlobContainerConformanceTests.class'
  exclude '**/ServerlessOnObjectStoreTests.class'
  exclude '**/ServerlessBucketContentionTests.class'
  exclude '**/ServerlessCostTests.class'
  exclude '**/ServerlessScaleMeasurementTests.class'
  exclude '**/ServerlessDeleteCostTests.class'
  exclude '**/S3LogFencingTests.class'
  exclude '**/S3AliasReverseHintRaceTests.class'
  exclude '**/ServerlessLogRepairTests.class'
  exclude '**/Serverless*MeasurementTests.class'
  exclude '**/ServerlessFleetScaleTests.class'
  exclude '**/ServerlessRealPluginTests.class'
  exclude '**/ServerlessTlsTests.class'
  exclude '**/GcsEmulator*Tests.class'
  exclude '**/SharedSchemaHeapTests.class'
  exclude '**/WriteBufferHeapTests.class'
  exclude '**/Azurite*Tests.class'
}

/*
 * Installing a real, assembled plugin.
 *
 * analysis-icu is chosen for what it drags with it: a 14MB icu4j and a Lucene analysis jar, so the loader
 * is exercised on a plugin that brings dependencies rather than on a single class a test compiled. It is
 * also an AnalysisPlugin, so the test can prove the shell honours an extension point rather than merely
 * loading something. mapper-murmur3 is the second extension point -- a field type -- and installing both at
 * once also covers a node running more than one installed plugin, which nothing else does.
 *
 * Its own task because it reads that zip out of the build tree, which the test framework's security
 * manager denies -- rightly, since reading build artefacts is not something a node does. One test loses
 * the filter rather than the whole module.
 *
 * The distributions directory rather than the task's output file: reaching across projects for a task
 * output couples configuration in a way Gradle keeps making harder, and the test globs for the zip anyway.
 */
tasks.register('pluginTest', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/ServerlessRealPluginTests.class'
  dependsOn ':plugins:analysis-icu:bundlePlugin'
  dependsOn ':plugins:mapper-murmur3:bundlePlugin'
  systemProperty 'tests.serverless.plugin.dists', [
    project(':plugins:analysis-icu').projectDir.toString() + '/build/distributions',
    project(':plugins:mapper-murmur3').projectDir.toString() + '/build/distributions'
  ].join(File.pathSeparator)
  systemProperty 'tests.security.manager', 'false'
}

// Conformance against a real S3 API. Its own task because it needs a running endpoint and because the AWS SDK v2
// insists on a config path -- S3Service hands System.getProperty("opensearch.path.conf") straight to
// System.setProperty, which throws NPE when it is unset. The rest of the module should not carry either.
tasks.register('s3Test', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/MinioBlobContainerConformanceTests.class'
  include '**/SeaweedBlobContainerConformanceTests.class'
  include '**/Rustfs*BlobContainerConformanceTests.class'
  include '**/ServerlessOnObjectStoreTests.class'
  include '**/ServerlessCostTests.class'
  include '**/ServerlessScaleMeasurementTests.class'
  include '**/ServerlessDeleteCostTests.class'
  include '**/S3LogFencingTests.class'
  include '**/S3AliasReverseHintRaceTests.class'
  include '**/Serverless*MeasurementTests.class'
  include '**/BlobContainerWrapperGuardTests.class'
  include '**/ServerlessLogRepairTests.class'
  // Meters that run on the filesystem by default and on a live endpoint with -Dtests.serverless.meter.store=s3 (MeterStores).
  // Each assume-skips unless its own switch is set, so including them here costs nothing.
  include '**/NodeLogSoakMeterTests.class'
  include '**/RefreshVisibilityMeterTests.class'
  include '**/FreshnessMeterTests.class'
  // Request-count tests of the bucket manifest swap and the pack collector, which run on the filesystem under `test` and here
  // on a live endpoint when -Dtests.serverless.meter.store=s3, so the same counts are asserted over HTTP.
  include '**/BucketCommitsTests.class'
  include '**/BucketCheckpointTests.class'
  include '**/NodePackCollectorTests.class'
  systemProperty 'opensearch.path.conf', 'config'
  systemProperty 'tests.security.manager', 'false'
  // Netty refuses a second attempt to set its global processor count, and both the node's transport and
  // the S3 client's event loop group try. Telling it not to is what a real node does too.
  systemProperty 'opensearch.set.netty.runtime.available.processors', 'false'
}

/*
 * TLS on the transport, which needs the security manager off.
 *
 * Netty's SSL handler opens the connection from netty-common's own protection domain, and the test
 * framework grants that domain nothing -- so the handshake dies with "Denied access to: localhost:<port>"
 * while a plain netty4 connection in the same build is fine. Nothing about that is the shell's, and one
 * test class loses the manager rather than the module.
 */
tasks.register('tlsTest', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/ServerlessTlsTests.class'
  systemProperty 'tests.security.manager', 'false'
}

tasks.register('processTest', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/ServerlessContentionTests.class'
  include '**/ServerlessFleetTests.class'
  // Forks real JVMs *and* talks to S3, so it needs both this task's seccomp exemption and the config
  // path the AWS SDK insists on.
  include '**/ServerlessBucketContentionTests.class'
  systemProperty 'opensearch.path.conf', 'config'
  systemProperty 'tests.system_call_filter', 'false'
  // The forked node must run a PRODUCTION classpath. OpenSearch's Randomness decides it is "running
  // tests" purely by whether randomizedtesting is loadable, and then demands a test context that a real
  // main() has no way to provide -- so a child on the test classpath dies inside NodeEnvironment. The
  // main source set's runtime classpath is server + shell + netty4 without the test framework, which is
  // also simply the more faithful thing to fork.
  systemProperty 'serverless.node.classpath', sourceSets.main.runtimeClasspath.asPath
}

/*
 * A fleet of real shell processes on an S3 API, under load and through failures, judged by a ledger of every
 * write. Parameterised by -Dtests.fleet.* (see ServerlessFleetScaleTests) so a real bucket needs no code change:
 *
 *   ./gradlew :serverless:testkit:fleetTest -Dtests.fleet.endpoint=http://127.0.0.1:9200
 *       -Dtests.fleet.nodes=6 -Dtests.fleet.population=1000000 -Dtests.fleet.scenario_seconds=600
 *
 * Not part of check: it runs for an hour or more and needs a store to point at.
 */
tasks.register('fleetTest', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/ServerlessFleetScaleTests.class'
  systemProperty 'opensearch.path.conf', 'config'
  systemProperty 'tests.system_call_filter', 'false'
  systemProperty 'tests.security.manager', 'false'
  systemProperty 'opensearch.set.netty.runtime.available.processors', 'false'
  systemProperty 'serverless.node.classpath', sourceSets.main.runtimeClasspath.asPath
  maxHeapSize = '4g'
  // Runs for hours: the framework's thirty-minute default would abandon it mid-scenario.
  systemProperty 'tests.timeoutSuite', '86400000!'
  systemProperty 'tests.timeout', '86400000!'
  // Every tests.fleet.* property given to Gradle reaches the test JVM.
  System.getProperties().each { key, value ->
    if (key.toString().startsWith('tests.fleet.')) {
      systemProperty key.toString(), value.toString()
    }
  }
  outputs.upToDateWhen { false }
}

/*
 * The conformance and WAL fencing suites against GCS and Azure emulators (fake-gcs-server and Azurite), through
 * the production GCS and Azure blob stores. Not part of check: it needs both emulators running, and each test
 * skips when its emulator is not reachable. Start them with:
 *
 *   docker run -d -p 4443:4443 fsouza/fake-gcs-server:1.56.1 -scheme http -port 4443 -public-host 127.0.0.1:4443
 *   docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.35.0 azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
 *
 *   ./gradlew :serverless:testkit:emulatorTest [-Dtests.serverless.gcs.endpoint=...] [-Dtests.serverless.azure.endpoint=...]
 */
tasks.register('emulatorTest', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/GcsEmulator*Tests.class'
  include '**/Azurite*Tests.class'
  systemProperty 'tests.security.manager', 'false'
  systemProperty 'opensearch.set.netty.runtime.available.processors', 'false'
  ['tests.serverless.gcs.endpoint', 'tests.serverless.azure.endpoint'].each { key ->
    if (System.getProperty(key) != null) {
      systemProperty key, System.getProperty(key)
    }
  }
}

tasks.named('check').configure {
  dependsOn 'processTest'
  dependsOn 'pluginTest'
  dependsOn 'tlsTest'
  // Safe to always depend on: with no endpoint reachable the tests assume-skip rather than fail, so a
  // developer without a container gets a loud skip instead of a red build.
  dependsOn 's3Test'
}

// The REST API spec, on the test classpath. ServerlessSpecCoverageTests walks every path in it against a
// running node and asserts each is served or refused with a reason -- never core's default 400 "no
// handler found for uri". Copied from the spec module rather than duplicated, so the list cannot drift.
tasks.named('processTestResources').configure {
  from(project(':rest-api-spec').file('src/main/resources/rest-api-spec/api')) {
    into 'rest-api-spec/api'
  }
}

apply from: "${rootDir}/serverless/forbidden-references.gradle"

/*
 * Heap per open index when many indices share one mapping (SharedSchemaHeapTests), and what a write leaves
 * behind (WriteBufferHeapTests). Measurements, not part of check:
 *
 *   ./gradlew :serverless:testkit:schemaHeapTest -Dtests.schema.indices=10000 [-Dtests.schema.mapping=trivial]
 */
tasks.register('schemaHeapTest', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/SharedSchemaHeapTests.class'
  include '**/WriteBufferHeapTests.class'
  systemProperty 'tests.security.manager', 'false'
  maxHeapSize = '10g'
  systemProperty 'tests.timeoutSuite', '86400000!'
  systemProperty 'tests.timeout', '86400000!'
  System.getProperties().each { key, value ->
    if (key.toString().startsWith('tests.schema.') || key.toString().startsWith('tests.writeheap.')) {
      systemProperty key.toString(), value.toString()
    }
  }
  outputs.upToDateWhen { false }
}
