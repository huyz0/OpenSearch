apply plugin: 'opensearch.build'

dependencies {
  // RFC §4 rule 1: serverless may depend on server. server may never point back.
  implementation project(':server')
  implementation project(':libs:opensearch-common')
  implementation project(':libs:opensearch-core')
  implementation project(':libs:opensearch-telemetry')
  // The shell picks its transport directly instead of discovering it through the plugin system.
  implementation project(':modules:transport-netty4')
}

test.enabled = false

// Netty and the transport module bring transitive third-party jars the audit cannot resolve for a
// non-distribution project; the shell publishes nothing, so the audit adds no safety here.
tasks.named('thirdPartyAudit').configure { enabled = false }
tasks.named('dependencyLicenses').configure { enabled = false }
tasks.named('forbiddenApisMain').configure { replaceSignatureFiles 'jdk-signatures' }

/*
 * RFC §4 rule 1 / §13.2 — direction is absolute and CI-enforced.
 *
 * serverless/ may depend on server. server may NEVER reference serverless. This is what keeps
 * upstream merges routine; as a convention it would erode one commit at a time, so it is a task.
 *
 * Deliberately lives here rather than in server/build.gradle: the rule is ours to enforce, and
 * putting it in server/ would itself be a change to server/ that upstream never asked for.
 */
def serverSourceDirs = [
  file("${rootDir}/server/src/main/java"),
  file("${rootDir}/server/src/test/java")
]

tasks.register('checkServerDoesNotReferenceServerless') {
  description = 'Fails if any file under server/ references org.opensearch.serverless'
  group = 'verification'
  doLast {
    def offenders = []
    serverSourceDirs.each { dir ->
      if (dir.exists()) {
        fileTree(dir: dir, include: '**/*.java').each { f ->
          if (f.text.contains('org.opensearch.serverless')) {
            offenders << f.absolutePath.replace("${rootDir}/", '')
          }
        }
      }
    }
    if (!offenders.isEmpty()) {
      throw new GradleException(
        "RFC §4 rule 1 violated — server/ must never reference serverless:\n  " + offenders.join("\n  ")
      )
    }
    logger.lifecycle("§4 rule 1 holds: no server/ file references org.opensearch.serverless")
  }
}

tasks.named('check').configure { dependsOn 'checkServerDoesNotReferenceServerless' }
