apply plugin: 'opensearch.build'

dependencies {
  api project(':libs:opensearch-common')
  api project(':libs:opensearch-core')
  testImplementation project(':test:framework')
  testImplementation project(':serverless:ratis-common')
}

// This engine-independent library does not carry server/CLI classes referenced by server signatures.
tasks.named('forbiddenApisMain').configure { replaceSignatureFiles 'jdk-signatures' }
