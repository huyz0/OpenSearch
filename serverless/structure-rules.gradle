/*
 * Structure rules for the shell's main sources, checked on every precommit.
 *
 * Each rule is a predicate over the files in the tree, so the build checks it rather than a reviewer. Code that
 * broke a rule before the rule existed is listed in serverless/structure-baseline/: the check fails on anything
 * new, and on a baseline entry that no longer applies, so the lists only shrink. After fixing a listed file, run
 * updateStructureBaseline and commit the shorter list. Never add an entry to make new code pass.
 *
 *   Layers        A package may only reference packages in lower layers (imports and fully qualified names
 *                 alike). Every package must be given a layer here.
 *   Setting keys  A "serverless.*" or "index.serverless.*" string literal belongs in a *Settings class, so every
 *                 setting has one definition that can be listed and validated.
 *   Class size    No main source file over 1,000 lines. Listed files may shrink but not grow.
 *   Package size  No package over 40 files. Listed packages may shrink but not grow.
 */

def structureSourceRoot = file('src/main/java/org/opensearch/serverless')
def structureBaselineDir = file("${rootDir}/serverless/structure-baseline")

// Lowest first. A package may reference any package in a strictly lower layer.
def structureLayers = [
  store: 0, routing: 0, schema: 0, pipeline: 0,
  ingest: 1, membership: 1,
  cluster: 2,
  metadata: 3,
  engine: 4, script: 4,
  shard: 5,
  reconcile: 6, split: 6, bucket: 6,
  transport: 7,
  rest: 8,
  shell: 9
]
def maxClassLines = 1000
def maxPackageFiles = 40

def structureFindings = {
  def sources = []
  structureSourceRoot.eachFileRecurse(groovy.io.FileType.FILES) { f ->
    if (f.name.endsWith('.java')) {
      sources << f
    }
  }
  sources.sort { it.path }
  def relative = { File f -> structureSourceRoot.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
  def unknownPackages = new TreeSet<String>()
  def layers = new TreeSet<String>()
  def settingKeys = new TreeSet<String>()
  def classSizes = new TreeMap<String, Integer>()
  def packageSizes = new TreeMap<String, Integer>()
  def reference = ~/org\.opensearch\.serverless\.([a-z]+)\./
  def settingKey = ~/"(index\.)?serverless\.[a-z_][a-z0-9_.]*"/
  sources.each { f ->
    def path = relative(f)
    def from = path.contains('/') ? path.substring(0, path.indexOf('/')) : ''
    if (structureLayers.containsKey(from) == false) {
      unknownPackages << from
    }
    def text = f.getText('UTF-8')
    def targets = new TreeSet<String>()
    def m = reference.matcher(text)
    while (m.find()) {
      targets << m.group(1)
    }
    targets.each { to ->
      if (to == from) {
        return
      }
      if (structureLayers.containsKey(to) == false) {
        unknownPackages << to
      } else if (structureLayers.containsKey(from) && structureLayers[from] <= structureLayers[to]) {
        layers << "${path} -> ${to}".toString()
      }
    }
    if (f.name.endsWith('Settings.java') == false && settingKey.matcher(text).find()) {
      settingKeys << path
    }
    def lines = text.readLines().size()
    if (lines > maxClassLines) {
      classSizes[path] = lines
    }
    if (f.name != 'package-info.java') {
      packageSizes[from] = (packageSizes[from] ?: 0) + 1
    }
  }
  packageSizes = packageSizes.findAll { it.value > maxPackageFiles } as TreeMap
  return [unknownPackages: unknownPackages, layers: layers, settingKeys: settingKeys, classSizes: classSizes, packageSizes: packageSizes]
}

def readBaseline = { String name ->
  def f = new File(structureBaselineDir, name)
  return f.exists() ? f.readLines('UTF-8').findAll { it.trim() && it.startsWith('#') == false }.collect { it.trim() } : []
}

def baselineHeader = { String rule ->
  return "# ${rule} -- code that broke this rule before the rule existed. Generated by updateStructureBaseline;\n" +
    "# shorten it after a fix, never lengthen it. See serverless/structure-rules.gradle.\n"
}

tasks.register('updateStructureBaseline') {
  description = 'Rewrites serverless/structure-baseline/ from the current tree, after a fix shortened a list'
  group = 'verification'
  doLast {
    def found = structureFindings()
    if (found.unknownPackages.isEmpty() == false) {
      throw new GradleException('Give these packages a layer in serverless/structure-rules.gradle first: ' + found.unknownPackages)
    }
    structureBaselineDir.mkdirs()
    new File(structureBaselineDir, 'layers.txt').setText(baselineHeader('Layers') + found.layers.join('\n') + '\n', 'UTF-8')
    new File(structureBaselineDir, 'setting-keys.txt').setText(baselineHeader('Setting keys') + found.settingKeys.join('\n') + '\n', 'UTF-8')
    new File(structureBaselineDir, 'class-size.txt').setText(
      baselineHeader('Class size') + found.classSizes.collect { k, v -> "${k} ${v}" }.join('\n') + '\n', 'UTF-8')
    new File(structureBaselineDir, 'package-size.txt').setText(
      baselineHeader('Package size') + found.packageSizes.collect { k, v -> "${k} ${v}" }.join('\n') + '\n', 'UTF-8')
  }
}

def checkStructure = tasks.register('checkServerlessStructure') {
  description = 'Fails on new layer violations, stray setting keys, and classes or packages over their size limits'
  group = 'verification'
  inputs.dir(structureSourceRoot)
  inputs.dir(structureBaselineDir)
  outputs.upToDateWhen { false }
  doLast {
    def found = structureFindings()
    def problems = []
    if (found.unknownPackages.isEmpty() == false) {
      problems << 'Packages with no layer (add them to structureLayers in serverless/structure-rules.gradle):\n  ' +
        found.unknownPackages.join('\n  ')
    }
    def compareSets = { String rule, String file, Set<String> current, String advice ->
      def listed = readBaseline(file) as Set
      def added = current.findAll { listed.contains(it) == false }
      def gone = listed.findAll { current.contains(it) == false }
      if (added) {
        problems << "${rule}: new violations. ${advice}\n  " + added.join('\n  ')
      }
      if (gone) {
        problems << "${rule}: fixed, so remove from serverless/structure-baseline/${file} (or run updateStructureBaseline):\n  " +
          gone.join('\n  ')
      }
    }
    compareSets('Layers', 'layers.txt', found.layers,
      'Depend on a lower layer only; move the shared type down, or pass in a narrow interface.')
    compareSets('Setting keys', 'setting-keys.txt', found.settingKeys,
      'Define the key in a *Settings class and reference the constant.')
    def compareSizes = { String rule, String file, Map<String, Integer> current, int limit ->
      def listed = readBaseline(file).collectEntries { line ->
        def parts = line.split(' ')
        [(parts[0]): parts[1] as int]
      }
      current.each { k, v ->
        if (listed.containsKey(k) == false) {
          problems << "${rule}: ${k} is ${v}, over the limit of ${limit}. Split it."
        } else if (v > listed[k]) {
          problems << "${rule}: ${k} grew from ${listed[k]} to ${v}; listed entries may shrink but not grow."
        }
      }
      listed.keySet().findAll { current.containsKey(it) == false }.each { k ->
        problems << "${rule}: ${k} is now within ${limit}, so remove it from serverless/structure-baseline/${file}."
      }
    }
    compareSizes('Class size', 'class-size.txt', found.classSizes, maxClassLines)
    compareSizes('Package size', 'package-size.txt', found.packageSizes, maxPackageFiles)
    if (problems) {
      throw new GradleException('Serverless structure rules broken:\n\n' + problems.join('\n\n'))
    }
    logger.lifecycle("Serverless structure rules hold (baseline: ${found.layers.size()} layer exceptions, " +
      "${found.settingKeys.size()} files with setting keys)")
  }
}

tasks.named('precommit').configure { dependsOn checkStructure }
