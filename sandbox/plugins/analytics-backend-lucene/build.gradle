apply plugin: 'opensearch.internal-cluster-test'

opensearchplugin {
    description = 'OpenSearch plugin providing Lucene-based search execution engine'
    classname = 'org.opensearch.be.lucene.LucenePlugin'
    // analytics-engine only. This plugin references no composite-engine class (verified: no
    // org.opensearch.composite import anywhere under src/) and had no gradle dependency on
    // composite-engine either, so nothing verified that edge. It existed solely to borrow
    // composite-engine's bundled plugin-stats-spi jar, which inverted the layering — the
    // backend could not be installed without the orchestrator above it. plugin-stats-spi is
    // bundled here directly instead (see dependencies below).
    extendedPlugins = ['analytics-engine']
}

java { sourceCompatibility = JavaVersion.toVersion(25); targetCompatibility = JavaVersion.toVersion(25) }

// Calcite (via analytics-engine) requires Guava which OpenSearch forbids on compile classpath.
// Use custom config to bypass, same as analytics-engine.
configurations {
    calciteCompile
    calciteTestCompile
    compileClasspath { exclude group: 'com.google.guava' }
    testCompileClasspath { exclude group: 'com.google.guava' }
}

// Pin flatbuffers across every test classpath. AggregateFunction's <clinit> instantiates
// ArrowType.Int, whose generated FlatBuffers schema descends from com.google.flatbuffers.Table;
// without the force, transitive 24.x clashes with the project-wide 2.0.0. Matches the
// analytics-backend-datafusion pattern.
configurations.all {
    resolutionStrategy {
        force "com.google.flatbuffers:flatbuffers-java:${versions.flatbuffers}"
    }
}
sourceSets.main.compileClasspath += configurations.calciteCompile
sourceSets.test.compileClasspath += configurations.calciteTestCompile

dependencies {
    // Shared types and SPI interfaces — provided at runtime by the parent analytics-engine plugin (extendedPlugins above).
    compileOnly project(':sandbox:libs:analytics-framework')
    compileOnly project(':sandbox:plugins:analytics-engine')

    // Plugin stats SPI. Bundled (not compileOnly) so this plugin owns the jar it needs at
    // runtime instead of borrowing it from composite-engine's classloader. Every use of the
    // SPI registry is intra-plugin — LuceneStatsProvider registers "lucene" and only lucene's
    // own REST/transport actions look "lucene" up — so a per-plugin copy of
    // DataFormatStatsProviderRegistry is self-consistent, and neither analytics-engine nor
    // arrow-base bundles the SPI, so there is no jar-hell overlap with the parent chain.
    implementation project(":sandbox:libs:plugin-stats-spi")

    // Arrow vector + memory — needed by the Lucene-as-driver count fast path to emit
    // Arrow batches as the engine's result. Provided at runtime via the analytics-engine
    // plugin (which itself depends on arrow via arrow-base).
    compileOnly "org.apache.arrow:arrow-vector:${versions.arrow}"
    compileOnly "org.apache.arrow:arrow-memory-core:${versions.arrow}"
    compileOnly "org.apache.arrow:arrow-format:${versions.arrow}"
    // Arrow C-Data interface: the count batch is built via export+import so the resulting
    // VSR has the same buffer layout DataFusion's result vectors arrive in. Without this,
    // pure-Java setSafe + Flight VectorTransfer.transferRoot zeros the underlying memory.
    implementation "org.apache.arrow:arrow-c-data:${versions.arrow}"

    // Substrait core — used by LuceneFragmentConvertor.convertSchemaOnlyRead to emit a
    // Plan{Read{named_table; base_schema}} stub that the coordinator's reduce sink decodes
    // for partition-schema derivation. Lucene's convertFragment produces a non-Substrait
    // wire format (BoolQueryBuilder NamedWriteable bytes), so the schema-only Read is the
    // only piece the reducer needs to be able to prost::decode.
    implementation "io.substrait:core:0.89.1"

    // Arrow's Schema.class carries @JsonInclude / @JsonTypeInfo / @JsonProperty annotations.
    // compileOnly so it doesn't bundle at runtime (Jackson is provided by server) but
    // resolves on the javadoc classpath — without this, javadoc -Werror fails on unknown
    // enum-constant warnings in transitive Arrow types.
    compileOnly "com.fasterxml.jackson.core:jackson-annotations:${versions.jackson_annotations}"

    // log4j-api/log4j-core are on the server (core) classpath — see server/build.gradle
    // (`api libs.log4japi` / `api libs.log4jcore`). Bundling them here would duplicate core
    // codebases in the plugin zip; compileOnly matches analytics-backend-datafusion. They stay
    // on the unit-test classpath because OpenSearchJavaPlugin wires
    // testImplementation.extendsFrom(compileOnly).
    compileOnly "org.apache.logging.log4j:log4j-api:${versions.log4j}"
    compileOnly "org.apache.logging.log4j:log4j-core:${versions.log4j}"

    // Planner infrastructure for end-to-end delegation tests
    testImplementation project(':sandbox:plugins:analytics-engine')

    // Guava for compilation — Calcite Sarg/RangeSet API exposes guava types
    calciteCompile "com.google.guava:guava:${versions.guava}"
    calciteTestCompile "com.google.guava:guava:${versions.guava}"
    testRuntimeOnly "com.google.guava:guava:${versions.guava}"
    testRuntimeOnly 'com.google.guava:failureaccess:1.0.2'
    // AggregateFunction's <clinit> instantiates ArrowType.Int, whose generated FlatBuffers
    // schema descends from com.google.flatbuffers.Table. arrow-format / flatbuffers are
    // provided at runtime by analytics-engine in production but not on the unit-test JVM.
    testRuntimeOnly "org.apache.arrow:arrow-format:${versions.arrow}"
    testRuntimeOnly "com.google.flatbuffers:flatbuffers-java:${versions.flatbuffers}"

    // Calcite annotation compatibility
    testCompileOnly 'org.immutables:value-annotations:2.8.8'
}

test {
    systemProperty 'tests.security.manager', 'false'
}

tasks.withType(JavaCompile).configureEach {
    // Calcite annotation warnings with JDK 25 — harmless
    options.compilerArgs -= '-Werror'
}

// TODO: Remove once back-end is built out with test suite
testingConventions.enabled = false
