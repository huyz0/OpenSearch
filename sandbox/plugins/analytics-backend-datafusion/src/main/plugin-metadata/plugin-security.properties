# Declares node settings that name operator-configured directories this plugin's
# plugin-security.policy references. For each declared setting key <key> with a
# non-empty value, core (org.opensearch.bootstrap.Security):
#  - sets ${opensearch.<key>} while parsing this plugin's policy file, so grants can
#    be scoped to the configured directory instead of <<ALL FILES>>;
#  - adds a core-side permission ledger entry for the directory (core health probes
#    access it), requiring the directory to already exist at boot.
directory.settings=datafusion.spill_directory
