name: Serverless RustFS verification

on:
  pull_request:
    branches: [ feature/serverlessshell ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverless-rustfs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustfs-smoke:
    name: Serverless RustFS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: python3 -B serverless/tools/usage_collector.py --self-test
      - run: >-
          bash serverless/dev-tools/rustfs-gate.sh smoke --no-daemon --max-workers=4
          :serverless:shell:precommit :serverless:testkit:precommit
          :serverless:shell:checkServerDoesNotReferenceServerless

  rustfs-fleet:
    name: Serverless RustFS pre-release fleet
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'verify-rustfs-fleet')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: bash serverless/dev-tools/rustfs-gate.sh fleet --no-daemon --max-workers=4
